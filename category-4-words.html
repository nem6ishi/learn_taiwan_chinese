<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATEGORY 4 単語・フレーズ一覧 | 実用文法 ＆ 基本文型 | 台湾華語学習サイト</title>
  <meta name="description" content="CATEGORY 4（実用文法 ＆ 基本文型）の単語・フレーズ一覧。">
  <link rel="stylesheet" href="src/styles/main.css">
  <style>
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .word-card {
      background: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .word-card:hover {
      border-color: var(--color-primary);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      transform: translateY(-2px);
    }
    .word-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .word-trad {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--color-text-main);
    }
    .word-phonetics {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .word-zhuyin {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--color-primary);
      background: var(--color-primary-light);
      padding: 2px 10px;
      border-radius: 4px;
    }
    .word-meaning {
      font-size: 0.88rem;
      color: #475569;
      margin-top: 2px;
    }
    .word-section-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--color-text-main);
      padding-bottom: 8px;
      border-bottom: 2px solid var(--color-border);
      margin-top: 36px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-badge">台</span>
        <span>台湾華語学習サイト</span>
      </a>
      <div style="display: flex; align-items: center; gap: 12px;">
        <a href="zhuyin-chart.html" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem;">
          📋 注音符号一覧表
        </a>
        <a href="index.html" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.85rem;">
          ← トップ一覧へ戻る
        </a>
      </div>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <main class="container" style="padding-top: 32px; padding-bottom: 60px;">
    
    <!-- ページヘッダー -->
    <div style="background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 28px 24px; margin-bottom: 28px;">
      <span style="background: var(--color-primary-light); color: var(--color-primary); font-size: 0.82rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 8px;">
        📖 CATEGORY 4 単語・フレーズまとめ
      </span>
      <h1 style="font-size: 1.75rem; font-weight: 900; margin-bottom: 8px;">
        実用文法 ＆ 基本文型 単語一覧
      </h1>
      <p style="color: var(--color-text-muted); font-size: 0.92rem; line-height: 1.5; margin: 0;">
        基本文法・比較・存在表現などで使用される語彙です。<br>
        カードをタップするとリアルな台湾華語の音声（Google 國語 / Meijia）が再生されます。
      </p>
    </div>

    <h2 class="word-section-title">
      <span>📚 基本文法・疑問詞・場所表現</span>
    </h2>
    <div class="word-grid">
      <div class="word-card play-word-sound" data-word="在哪裡">
        <div class="word-main">
          <span class="word-trad">在哪裡</span>
          <div class="word-phonetics">
            <span class="word-zhuyin">ㄗㄞˋ ㄋㄚˇ ㄌㄧˇ</span>
          </div>
          <span class="word-meaning">どこですか？</span>
        </div>
        <div class="audio-icon-tag"><span>🔊</span></div>
      </div>

      <div class="word-card play-word-sound" data-word="洗手間">
        <div class="word-main">
          <span class="word-trad">洗手間</span>
          <div class="word-phonetics">
            <span class="word-zhuyin">ㄒㄧˇ ㄕㄡˇ ㄐㄧㄢ</span>
          </div>
          <span class="word-meaning">お手洗い / トイレ</span>
        </div>
        <div class="audio-icon-tag"><span>🔊</span></div>
      </div>

      <div class="word-card play-word-sound" data-word="多少錢">
        <div class="word-main">
          <span class="word-trad">多少錢</span>
          <div class="word-phonetics">
            <span class="word-zhuyin">ㄉㄨㄛ ㄕㄠˇ ㄑㄧㄢˊ</span>
          </div>
          <span class="word-meaning">いくらですか？</span>
        </div>
        <div class="audio-icon-tag"><span>🔊</span></div>
      </div>
    </div>

    <!-- 戻るナビゲーション -->
    <div style="text-align: center; background: var(--color-bg-subtle); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 32px; margin-top: 48px;">
      <a href="index.html" class="btn btn-outline" style="padding: 10px 20px; font-size: 0.95rem;">
        トップ一覧へ戻る
      </a>
    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 台湾華語学習サイト</p>
    </div>
  </footer>

  <script type="module" src="src/js/appData.js"></script>
  <script type="module" src="src/js/appCore.js"></script>
  <script type="module" src="src/js/categoryWords.js"></script>
</body>
</html>

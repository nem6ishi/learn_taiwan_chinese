<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>母音ステップ1（ㄚ ㄛ ㄜ ㄝ ㄞ）| 注音ナビ</title>
  <meta name="description" content="台湾華語の基本母音「ㄚ ㄛ ㄜ ㄝ ㄞ」をシンプルにマスター。">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-badge">ㄅ</span>
        <span>注音ナビ</span>
      </a>
      <a href="index.html" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.85rem;">
        ← トップへ戻る
      </a>
    </div>
  </nav>

  <!-- 学習メインエリア -->
  <main class="container" style="padding-top: 32px; padding-bottom: 40px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
      <div>
        <span style="font-size: 0.85rem; font-weight: 700; color: var(--color-primary);">STEP 01</span>
        <h1 style="font-size: 1.75rem; font-weight: 900;">基本の母音 5文字</h1>
      </div>
      <button class="btn btn-primary" id="start-quiz-btn">
        確認クイズ (全5問)
      </button>
    </div>

    <!-- シンプルなプログレスバー -->
    <div style="background: #E2E8F0; height: 6px; border-radius: 4px; overflow: hidden; margin: 16px 0 24px;">
      <div id="progress-fill" style="background: var(--color-primary); height: 100%; width: 20%; transition: width 0.3s ease;"></div>
    </div>

    <!-- サイドバー & メインコンテンツ -->
    <div class="vowel-app-grid" id="main-learning-view">
      
      <!-- サイドバー -->
      <aside class="vowel-sidebar" id="vowel-sidebar">
        <!-- JSで生成 -->
      </aside>

      <!-- 詳細表示エリア -->
      <section class="detail-card" id="detail-card-area">
        <!-- JSで生成 -->
      </section>

    </div>

    <!-- クイズセクション -->
    <section class="quiz-section" id="quiz-section">
      <div style="max-width: 500px; margin: 0 auto; text-align: center;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <span style="font-weight: 700; color: var(--color-primary);" id="quiz-progress-text">第 1 / 5 問</span>
          <button class="btn btn-outline" id="close-quiz-btn" style="padding: 4px 10px; font-size: 0.8rem;">
            学習に戻る
          </button>
        </div>

        <h3 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 16px;" id="quiz-question-prompt">
          問題
        </h3>

        <div style="margin: 20px 0;" id="quiz-audio-trigger-area">
          <button class="btn btn-outline" id="quiz-audio-play-btn">
            🔊 音声を聴く
          </button>
        </div>

        <div class="quiz-options" id="quiz-options-grid">
          <!-- JSで生成 -->
        </div>

        <div id="quiz-feedback-msg" style="margin-top: 20px; font-weight: 700; font-size: 1.1rem; min-height: 30px;"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 注音ナビ - 台湾中国語学習</p>
    </div>
  </footer>

  <script type="module" src="/src/js/vowelsApp.js"></script>
</body>
</html>

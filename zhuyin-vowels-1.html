<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEP 1-1: 唇音 (ㄅㄆㄇㄈ) ＋ 単母音 (ㄚㄛㄜㄝ) | 台湾華語学習サイト</title>
  <meta name="description" content="子音4つと母音4つを同時に学び、習った文字だけで 爸爸, 媽媽, 婆婆 などの単語をマスター。">
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-badge">台</span>
        <span>台湾華語学習サイト</span>
      </a>
      <a href="index.html" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.85rem;">
        ← トップ一覧へ戻る
      </a>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <main class="container" style="padding-top: 32px; padding-bottom: 60px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
      <div>
        <span style="font-size: 0.85rem; font-weight: 700; color: var(--color-primary);">注音符号 1-1: CONSONANTS & VOWELS SET 1</span>
        <h1 style="font-size: 1.75rem; font-weight: 900;">1-1 唇音（ㄅㄆㄇㄈ）＋ 基本の単母音（ㄚㄛㄜㄝ）</h1>
        <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-top: 4px;">
          ★この8文字だけで、身近な単語（八, 爸爸, 媽媽, 婆婆）がすべて読めるようになります！
        </p>
      </div>
      <button class="btn btn-primary" id="start-quiz-top-btn">
        🏆 確認クイズを受ける (全5問)
      </button>
    </div>

    <!-- 8文字を一気に並べるリストコンテナ -->
    <div id="vowel-list-container" style="display: flex; flex-direction: column; gap: 24px;">
      <!-- JSで全8文字カードを一括レンダリング -->
    </div>

    <!-- クイズ受講エリア (最下部) -->
    <div style="text-align: center; background: var(--color-bg-subtle); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 32px; margin-top: 40px;" id="quiz-cta-section">
      <h3 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 8px;">1-1 の8文字を一通りチェックしましたか？</h3>
      <p style="color: var(--color-text-muted); margin-bottom: 20px; font-size: 0.95rem;">
        習った文字だけで解ける「確認クイズ」で定着度を確かめましょう。
      </p>
      <div style="display: flex; justify-content: center; gap: 16px; margin-top: 16px; flex-wrap: wrap;">
        <button class="btn btn-primary" id="start-quiz-bottom-btn" style="padding: 12px 24px; font-size: 1rem;">
          🏆 確認クイズを始める
        </button>
        <a href="index.html" class="btn btn-outline" style="padding: 12px 24px; font-size: 1rem;">
          🏠 トップ一覧へ戻る
        </a>
      </div>
    </div>

    <!-- クイズモーダル/セクション -->
    <section class="quiz-section" id="quiz-section">
      <div style="max-width: 500px; margin: 0 auto; text-align: center;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <span style="font-weight: 700; color: var(--color-primary);" id="quiz-progress-text">第 1 / 5 問</span>
          <button class="btn btn-outline" id="close-quiz-btn" style="padding: 4px 10px; font-size: 0.8rem;">
            ✖ 学習に戻る
          </button>
        </div>

        <h3 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 16px;" id="quiz-question-prompt">
          問題
        </h3>

        <div style="margin: 20px 0;" id="quiz-audio-trigger-area">
          <button class="btn btn-outline" id="quiz-audio-play-btn">
            🔊 音声を聴く（再再生）
          </button>
        </div>

        <div class="quiz-options" id="quiz-options-grid">
          <!-- JSで生成 -->
        </div>

        <div id="quiz-feedback-msg" style="margin-top: 20px; font-weight: 700; font-size: 1.1rem; min-height: 30px;"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 台湾華語学習サイト</p>
    </div>
  </footer>

  <script src="src/js/appData.js"></script>
  <script src="src/js/appCore.js"></script>
  <script src="src/js/vowelsApp1.js"></script>
</body>
</html>

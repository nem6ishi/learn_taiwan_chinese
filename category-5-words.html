<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATEGORY 5 単語・フレーズ一覧 | TOCFL 台湾華語検定対策 | 台湾華語学習サイト</title>
  <meta name="description" content="CATEGORY 5（TOCFL 台湾華語検定対策）の単語・フレーズ一覧。">
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>

  <!-- ナビゲーションバー -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-badge">台</span>
        <span>台湾華語学習サイト</span>
      </a>
      <div style="display: flex; align-items: center; gap: 12px;">
        <a href="zhuyin-chart.html" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem;">
          📋 注音符号一覧表
        </a>
        <a href="index.html" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.85rem;">
          ← トップ一覧へ戻る
        </a>
      </div>
    </div>
  </nav>

  <!-- メインコンテンツ -->
  <main class="container" style="padding-top: 32px; padding-bottom: 60px;">
    
    <!-- ページヘッダー -->
    <div style="background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 28px 24px; margin-bottom: 28px;">
      <span style="background: var(--color-primary-light); color: var(--color-primary); font-size: 0.82rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 8px;">
        📖 CATEGORY 5 単語・フレーズまとめ
      </span>
      <h1 style="font-size: 1.75rem; font-weight: 900; margin-bottom: 8px;">
        TOCFL 台湾華語検定 必修単語一覧
      </h1>
      <p style="color: var(--color-text-muted); font-size: 0.92rem; line-height: 1.5; margin: 0;">
        TOCFL（華語文能力測驗）準備級・入門級の必修語彙です。<br>
        カードをタップするとリアルな台湾華語の音声（Google 國語 / Meijia）が再生されます。
      </p>
    </div>

    <h2 class="word-section-title">
      <span>🏆 TOCFL 準備級 / 入門級 最重要語彙</span>
    </h2>
    <div class="word-grid">
      <div class="word-card play-word-sound" data-word="學習">
        <div class="word-main">
          <span class="word-trad">學習</span>
          <div class="word-phonetics">
            <span class="word-zhuyin">ㄒㄩㄝˊ ㄒㄧˊ</span>
          </div>
          <span class="word-meaning">学習する / 学ぶ</span>
        </div>
        <div class="audio-icon-tag"><span>🔊</span></div>
      </div>

      <div class="word-card play-word-sound" data-word="考試">
        <div class="word-main">
          <span class="word-trad">考試</span>
          <div class="word-phonetics">
            <span class="word-zhuyin">ㄎㄠˇ ㄕˋ</span>
          </div>
          <span class="word-meaning">試験 / テスト</span>
        </div>
        <div class="audio-icon-tag"><span>🔊</span></div>
      </div>

      <div class="word-card play-word-sound" data-word="問題">
        <div class="word-main">
          <span class="word-trad">問題</span>
          <div class="word-phonetics">
            <span class="word-zhuyin">ㄨㄣˋ ㄊㄧˊ</span>
          </div>
          <span class="word-meaning">質問 / 問題</span>
        </div>
        <div class="audio-icon-tag"><span>🔊</span></div>
      </div>
    </div>

    <!-- 戻るナビゲーション -->
    <div style="text-align: center; background: var(--color-bg-subtle); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 32px; margin-top: 48px;">
      <a href="index.html" class="btn btn-outline" style="padding: 10px 20px; font-size: 0.95rem;">
        トップ一覧へ戻る
      </a>
    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 台湾華語学習サイト</p>
      <span class="version-badge">v1.1.0</span>
    </div>
  </footer>

  <script type="module" src="src/js/appData.js"></script>
  <script type="module" src="src/js/appCore.js"></script>
  <script type="module" src="src/js/categoryWords.js"></script>
</body>
</html>
